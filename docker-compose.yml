version: '3.8'

services:
  leaderboard:
    build: .
    container_name: leaderboard

    ports:
      - "3001:3001"

    volumes:
      # Persistent database + backups
      - leaderboard-data:/app/data

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/leaderboard.db
      - BACKUP_DIR=/app/data/backups

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const req=require('http').get('http://localhost:3001/api/stats',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      - leaderboard-network

  # =========================
  # S3 BACKUP (OPTIONAL)
  # =========================
  backup-s3:
    image: amazon/aws-cli:latest
    container_name: leaderboard-backup-s3

    volumes:
      - leaderboard-data:/data:ro

    env_file:
      - .env

    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-leaderboard-backups}

    entrypoint: >
      sh -c "
        while true; do
          echo \"[$$(date)] Syncing backups to S3...\"
          aws s3 sync /data/backups s3://$$S3_BUCKET/backups/ --storage-class STANDARD_IA || echo 'S3 sync failed';
          echo \"[$$(date)] Sync completed\"
          sleep 21600
        done
      "

    restart: unless-stopped
    depends_on:
      - leaderboard

    networks:
      - leaderboard-network

  # =========================
  # NGINX (OPTIONAL)
  # =========================
  nginx:
    image: nginx:alpine
    container_name: leaderboard-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro

    restart: unless-stopped
    depends_on:
      - leaderboard

    networks:
      - leaderboard-network

# =========================
# VOLUMES
# =========================
volumes:
  leaderboard-data:
    driver: local

# =========================
# NETWORK
# =========================
networks:
  leaderboard-network:
    driver: bridge